name: React Native

# Copied to feedoback/feedoback-sdks by scripts/release/mirror-sdks.sh and run
# there, where Actions is free. Edit it in the repository the SDKs come from,
# never in the mirror.

on:
  push:
    branches: [main]
    paths:
      - "react-native/**"
      - ".github/workflows/react-native.yml"
  pull_request:
    paths:
      - "react-native/**"
      - ".github/workflows/react-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-native/package-lock.json

      - run: npm ci
        working-directory: react-native

      - run: react-native/ci.sh
