name: Android

# Copied to feedoback/feedoback-sdks by scripts/release/mirror-sdks.sh and run
# there, where Actions is free. Edit it in the repository the SDKs come from,
# never in the mirror.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "protocol/fixtures/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "protocol/fixtures/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Pinned for the same reason the iOS job pins its image: the Android SDK
    # and build-tools come with it, and size.sh measures with that d8.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      # The wrapper fixes the Gradle version; this caches what it downloads.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The protocol fixtures are read from a directory up, which is why this
      # job is also triggered by a change to them.
      - run: android/ci.sh
